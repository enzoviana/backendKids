services:
  - type: web
    name: backendkids
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: kidsmed-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: FRONTEND_URL
        value: https://crossrole-manager.lovable.app
      - key: CORS_ORIGINS
        value: https://crossrole-manager.lovable.app,http://localhost:8080
databases:
  - name: kidsmed-db
    plan: basic-256mb
